name: Security & Core Test Suite

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Python Bytecode Compile Check
        run: |
          python -m py_compile backend/*.py tests/*.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Set up Deno
        uses: denoland/setup-deno@041b854f97b325bd60e53e9dc2de9cb9f9fa0c30 # v2.0.2
        with:
          deno-version: v2.x

      - name: Frontend JavaScript Type & Syntax Check
        run: |
          deno check frontend/app.js
